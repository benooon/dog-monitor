<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="{{alternateEn}}">
<link rel="alternate" hreflang="he" href="{{alternateHe}}">
<link rel="alternate" hreflang="x-default" href="{{alternateEn}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dog Monitor">
<meta property="og:title" content="{{h1}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{ogLocale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/media/touch-icon.png">
<link rel="stylesheet" href="/join.css">
<script src="/join.js" defer></script>
</head>
<body>
<main>
  <section class="hero">
    <div class="hero-text">
      <p class="brand"><img src="/favicon.svg" alt="" width="28" height="28"> Dog Monitor</p>
      <h1>{{h1}}</h1>
      <p class="lede">{{lede}}</p>
      <form class="join" method="post" action="/waitlist" data-state="{{state}}"
            data-msg-email="{{errEmail}}" data-msg-busy="{{errBusy}}" data-msg-network="{{errNetwork}}">
        <input type="hidden" name="locale" value="{{lang}}">
        <input type="hidden" name="source" value="{{source}}">
        <label for="email" class="visually-hidden">{{emailLabel}}</label>
        <div class="field">
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required
                 maxlength="254" placeholder="{{emailPlaceholder}}" dir="ltr" aria-describedby="form-status">
          <button type="submit">{{button}}</button>
        </div>
        <p id="form-status" class="status" role="status" aria-live="polite">{{statusText}}</p>
        <p class="note">{{note}}</p>
        <p class="success" tabindex="-1">{{success}}</p>
      </form>
    </div>
    <div class="hero-media">
      <video src="/media/hero.mp4" poster="/media/hero.jpg" autoplay muted loop playsinline
             preload="metadata" width="720" height="720" aria-label="{{videoLabel}}"></video>
    </div>
  </section>

  <section class="points">
    <article>
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
      <h2>{{b1Title}}</h2>
      <p>{{b1}}</p>
    </article>
    <article>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12V9.5A2.5 2.5 0 0 1 6.5 7h11A2.5 2.5 0 0 1 20 9.5V12"/><path d="M3 12.5A1.5 1.5 0 0 1 4.5 11h0A1.5 1.5 0 0 1 6 12.5V14h12v-1.5a1.5 1.5 0 0 1 3 0V17H3z"/><path d="M5 17v2M19 17v2"/></svg>
      <h2>{{b2Title}}</h2>
      <p>{{b2}}</p>
    </article>
    <article>
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg>
      <h2>{{b3Title}}</h2>
      <p>{{b3}}</p>
    </article>
  </section>
</main>
<footer>
  <p>{{footer}}</p>
  <p><a href="{{otherHref}}" hreflang="{{otherLangCode}}" lang="{{otherLangCode}}">{{otherLang}}</a></p>
</footer>
</body>
</html>
