<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const c = document.getElementById('c');
const ctx = c.getContext('2d');

const ACCENT = '#B4541F';
const COPY = {
  en: {
    hook: '“He never gets on the sofa.”',
    hookSub: 'me, leaving for work',
    later: 'One minute later',
    notifTitle: 'Rex is on the sofa.',
    notifSub: 'Living room',
    fromWork: 'Me, from work:',
    rex: 'Rex.',
    loop: '“He never gets on the sofa.”',
    room: 'Living room',
    live: 'Live',
    end1: 'See what your dog does when you’re out.',
    end2: 'Your old iPhone becomes the camera.',
    end3: 'Coming soon · link in bio',
    now: 'now',
  },
  he: {
    hook: '״הוא אף פעם לא עולה על הספה.״',
    hookSub: 'אני, בדרך לעבודה',
    later: 'דקה אחרי',
    notifTitle: 'רקס על הספה.',
    notifSub: 'סלון',
    fromWork: 'אני, מהעבודה:',
    rex: 'רקס.',
    loop: '״הוא אף פעם לא עולה על הספה.״',
    room: 'סלון',
    live: 'בשידור',
    end1: 'תראו מה הכלב עושה כשאתם לא בבית.',
    end2: 'האייפון הישן הופך למצלמה.',
    end3: 'בקרוב · הקישור בביו',
    now: 'עכשיו',
  },
};
let LANG = 'en';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const backOut = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// deterministic noise tiles for film grain
const grain = [];
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let k = 0; k < 4; k++) {
  const g = document.createElement('canvas'); g.width = 270; g.height = 480;
  const gx = g.getContext('2d'); const id = gx.createImageData(270, 480);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 16; }
  gx.putImageData(id, 0, 0); grain.push(g);
}

// ---------- room ----------
function drawRoom(t, doorOpen) {
  // wall
  const wall = ctx.createLinearGradient(0, 0, 0, 1240);
  wall.addColorStop(0, '#CFC6B8'); wall.addColorStop(1, '#E2DACD');
  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, 1240);
  // window with morning light
  ctx.fillStyle = '#F4EFE6'; rr(110, 400, 380, 500, 10); ctx.fill();
  const sky = ctx.createLinearGradient(0, 420, 0, 880);
  sky.addColorStop(0, '#A9C8DA'); sky.addColorStop(1, '#E6EEE8');
  ctx.fillStyle = sky; ctx.fillRect(130, 420, 340, 460);
  ctx.save(); ctx.beginPath(); ctx.rect(130, 420, 340, 460); ctx.clip();
  ctx.fillStyle = '#9DB59A'; // distant tree tops
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(150 + i * 80, 860 - (i % 2) * 30, 70, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#F4EFE6'; ctx.fillRect(292, 420, 16, 460); ctx.fillRect(130, 640, 340, 14);
  // light patch on floor from window
  ctx.save(); ctx.globalAlpha = .18; ctx.fillStyle = '#FFF6DF';
  ctx.beginPath(); ctx.moveTo(150, 1240); ctx.lineTo(470, 1240); ctx.lineTo(620, 1700); ctx.lineTo(120, 1700); ctx.closePath(); ctx.fill(); ctx.restore();
  // frame on wall
  ctx.fillStyle = '#3B342D'; rr(600, 520, 220, 160, 6); ctx.fill();
  ctx.fillStyle = '#E9C9A5'; ctx.fillRect(614, 534, 192, 132);
  ctx.fillStyle = ACCENT; ctx.beginPath(); ctx.arc(710, 620, 34, Math.PI, 0); ctx.fill(); // sunset print
  // floor
  const floor = ctx.createLinearGradient(0, 1240, 0, H);
  floor.addColorStop(0, '#9C7A57'); floor.addColorStop(1, '#B89270');
  ctx.fillStyle = floor; ctx.fillRect(0, 1240, W, H - 1240);
  ctx.strokeStyle = 'rgba(70,45,25,.18)'; ctx.lineWidth = 3;
  for (let i = -6; i < 14; i++) { ctx.beginPath(); ctx.moveTo(540 + i * 60, 1240); ctx.lineTo(540 + i * 150, H); ctx.stroke(); }
  ctx.fillStyle = '#EFE8DC'; ctx.fillRect(0, 1226, W, 18); // baseboard
  // rug
  ctx.fillStyle = '#5E6E77'; ctx.beginPath(); ctx.ellipse(560, 1600, 430, 120, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#D9D2C4'; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(560, 1600, 390, 100, 0, 0, Math.PI * 2); ctx.stroke();
  // plant
  ctx.fillStyle = '#C46B3B'; rr(40, 1300, 130, 150, 18); ctx.fill();
  ctx.fillStyle = '#4F6B4A';
  for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * .35; ctx.beginPath(); ctx.ellipse(105 + Math.cos(a) * 90, 1290 + Math.sin(a) * 120, 26, 80, a + Math.PI / 2, 0, Math.PI * 2); ctx.fill(); }
  // door (right), opening = 0 closed .. 1 open
  ctx.fillStyle = '#F2EDE4'; ctx.fillRect(930, 620, 170, 620); // frame
  ctx.fillStyle = '#F7F1E3'; ctx.fillRect(950, 640, 150, 600); // hallway light
  const dw = 150 * (1 - doorOpen * .82);
  ctx.fillStyle = '#B9A68E'; ctx.fillRect(950, 640, dw, 600);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(950 + dw - 8, 640, 8, 600);
  ctx.fillStyle = '#6B5B48'; ctx.beginPath(); ctx.arc(950 + dw - 26, 960, 9, 0, Math.PI * 2); ctx.fill();
}

function drawSofa() {
  // shadow
  ctx.fillStyle = 'rgba(40,25,10,.25)'; ctx.beginPath(); ctx.ellipse(660, 1320, 330, 30, 0, 0, Math.PI * 2); ctx.fill();
  // legs
  ctx.fillStyle = '#4A3A2A'; ctx.fillRect(370, 1270, 22, 50); ctx.fillRect(928, 1270, 22, 50);
  // back
  ctx.fillStyle = '#6F7F6A'; rr(370, 900, 580, 260, 46); ctx.fill();
  // back cushions
  ctx.fillStyle = '#7D8D77'; rr(440, 930, 220, 190, 34); ctx.fill(); rr(670, 930, 220, 190, 34); ctx.fill();
  // seat
  ctx.fillStyle = '#7D8D77'; rr(400, 1100, 520, 90, 26); ctx.fill();
  ctx.fillStyle = '#62725E'; rr(390, 1170, 540, 110, 24); ctx.fill();
  // arms
  ctx.fillStyle = '#62725E'; rr(340, 1030, 110, 250, 44); ctx.fill(); rr(870, 1030, 110, 250, 44); ctx.fill();
  // a throw pillow
  ctx.fillStyle = '#D9B26A'; ctx.save(); ctx.translate(500, 1060); ctx.rotate(-.2); rr(-60, -55, 120, 110, 26); ctx.fill(); ctx.restore();
}

// ---------- dog ----------
// pose: {legPhase, tail, earUp, eyes: 'open'|'closed'|'wide', lying (0..1), tilt, facing (1 right, -1 left), sweat}
function drawDog(x, y, s, p) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * p.facing, s);
  const lying = p.lying || 0;
  const legLen = lerp(82, 12, lying);
  const bodyY = -legLen - 58; // body center above paws
  ctx.rotate(p.tilt || 0);
  // shadow
  ctx.save(); ctx.rotate(-(p.tilt || 0));
  ctx.fillStyle = 'rgba(30,20,10,.22)'; ctx.beginPath(); ctx.ellipse(0, 4, 170, 22, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  const COAT = '#F4ECDF', PATCH = '#8A5A32', DARK = '#2A2019';
  // tail
  const tw = p.tail || 0;
  ctx.strokeStyle = COAT; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-130, bodyY - 20);
  ctx.quadraticCurveTo(-190, bodyY - 70 + lying * 40, -175 + Math.sin(tw) * 40, bodyY - 120 + lying * 70); ctx.stroke();
  // legs
  const leg = (lx, ph, far) => {
    const swing = Math.sin(ph) * 22 * (1 - lying);
    ctx.strokeStyle = far ? '#E0D5C4' : COAT; ctx.lineWidth = 30;
    ctx.beginPath(); ctx.moveTo(lx, bodyY + 20); ctx.lineTo(lx + swing, -8); ctx.stroke();
    ctx.fillStyle = far ? '#E0D5C4' : COAT; ctx.beginPath(); ctx.ellipse(lx + swing + 8, -6, 22, 11, 0, 0, Math.PI * 2); ctx.fill();
  };
  const lp = p.legPhase || 0;
  leg(-95, lp + Math.PI, true); leg(80, lp, true);
  // body
  ctx.fillStyle = COAT; rr(-150, bodyY - 62, 290, 124, 62); ctx.fill();
  ctx.fillStyle = PATCH; ctx.beginPath(); ctx.ellipse(-40, bodyY - 30, 70, 46, -.15, 0, Math.PI * 2); ctx.fill();
  leg(-115, lp, false); leg(100, lp + Math.PI, false);
  // collar
  const hx = 150, hy = bodyY - 70 + lying * 34;
  ctx.strokeStyle = ACCENT; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(108, bodyY - 70 + lying * 20); ctx.lineTo(128, bodyY + 4); ctx.stroke();
  ctx.fillStyle = '#E8B84A'; ctx.beginPath(); ctx.arc(126, bodyY + 18, 11, 0, Math.PI * 2); ctx.fill();
  // head
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(p.headTilt || 0);
  ctx.fillStyle = COAT; ctx.beginPath(); ctx.arc(0, 0, 68, 0, Math.PI * 2); ctx.fill();
  // snout
  rr(30, 0, 92, 54, 27); ctx.fill();
  ctx.fillStyle = DARK; ctx.beginPath(); ctx.ellipse(116, 12, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(70, 44); ctx.quadraticCurveTo(88, 54, 106, 42); ctx.stroke();
  // eye patch + eye
  ctx.fillStyle = PATCH; ctx.beginPath(); ctx.ellipse(18, -14, 38, 34, .3, 0, Math.PI * 2); ctx.fill();
  if (p.eyes === 'closed') {
    ctx.strokeStyle = DARK; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(30, -14, 12, .2, Math.PI - .2); ctx.stroke();
  } else {
    const r = p.eyes === 'wide' ? 17 : 11;
    if (p.eyes === 'wide') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(30, -16, r + 7, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(32, -16, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(36, -21, r * .35, 0, Math.PI * 2); ctx.fill();
  }
  // ear: floppy (earUp 0) to perked (1)
  const eu = p.earUp || 0;
  ctx.fillStyle = PATCH; ctx.save(); ctx.translate(-28, -46);
  ctx.rotate(lerp(.55, -.5, eu));
  ctx.beginPath(); ctx.ellipse(0, lerp(40, -30, eu), 26, 52, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // sweat drop
  if (p.sweat > 0) {
    ctx.globalAlpha = p.sweat; ctx.fillStyle = '#8FC6E8';
    ctx.beginPath(); ctx.moveTo(-40, -110); ctx.quadraticCurveTo(-18, -78, -40, -66); ctx.quadraticCurveTo(-62, -78, -40, -110); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.restore();
}

// ---------- overlays ----------
function font(w, px) { ctx.font = `${w} ${px}px Rubik`; }
function setDir() { ctx.direction = LANG === 'he' ? 'rtl' : 'ltr'; }

function wrapLines(text, maxW) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

// caption card, Instagram-native look: white card, black type, centered
function caption(text, sub, cy, a, scale = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; setDir();
  ctx.translate(W / 2, cy); ctx.scale(scale, scale);
  font(800, 62); const lines = wrapLines(text, 760);
  font(500, 38); const subW = sub ? ctx.measureText(sub).width : 0;
  font(800, 62);
  const lw = Math.max(subW, ...lines.map(l => ctx.measureText(l).width));
  const h = lines.length * 76 + (sub ? 58 : 0) + 56;
  ctx.fillStyle = '#FFFFFF'; ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  rr(-lw / 2 - 44, -h / 2, lw + 88, h, 34); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#16120F'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let y = -h / 2 + 28 + 38;
  for (const l of lines) { ctx.fillText(l, 0, y); y += 76; }
  if (sub) { font(500, 38); ctx.fillStyle = '#6E655C'; ctx.fillText(sub, 0, y - 8); }
  ctx.restore();
}

function pawIcon(x, y, size, bg = ACCENT, fg = '#FFF') {
  ctx.fillStyle = bg; rr(x, y, size, size, size * .23); ctx.fill();
  ctx.fillStyle = fg; const cx = x + size / 2, cy = y + size / 2, u = size / 100;
  ctx.beginPath(); ctx.ellipse(cx, cy + 14 * u, 22 * u, 18 * u, 0, 0, Math.PI * 2); ctx.fill();
  [[-27, -10], [-10, -27], [10, -27], [27, -10]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.ellipse(cx + dx * u, cy + dy * u, 9 * u, 11 * u, dx * .02, 0, Math.PI * 2); ctx.fill(); });
}

function notification(t0, t1, t) {
  const inP = easeOut(prog(t, t0, t0 + .45)), outP = easeIn(prog(t, t1 - .35, t1));
  if (inP <= 0 || outP >= 1) return;
  const y = lerp(-260, 250, inP) - outP * 520;
  ctx.save(); setDir();
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 14;
  ctx.fillStyle = 'rgba(250,247,243,.96)'; rr(50, y, 980, 210, 56); ctx.fill(); ctx.shadowColor = 'transparent';
  const rtl = LANG === 'he';
  const iconX = rtl ? 1030 - 36 - 112 : 86;
  pawIcon(iconX, y + 49, 112);
  ctx.textBaseline = 'alphabetic';
  const tx = rtl ? iconX - 32 : iconX + 112 + 32;
  ctx.textAlign = rtl ? 'right' : 'left';
  font(500, 32); ctx.fillStyle = '#7A726A'; ctx.fillText('Dog Monitor', tx, y + 78);
  ctx.textAlign = rtl ? 'left' : 'right'; ctx.fillText(COPY[LANG].now, rtl ? 86 : 994, y + 78);
  ctx.textAlign = rtl ? 'right' : 'left';
  font(700, 46); ctx.fillStyle = '#16120F'; ctx.fillText(COPY[LANG].notifTitle, tx, y + 132);
  font(500, 36); ctx.fillStyle = '#5C544C'; ctx.fillText(COPY[LANG].notifSub, tx, y + 176);
  ctx.restore();
}

function camChrome(t, clockSec) {
  // app-style status pill + clock: what the old iPhone on the shelf sees
  ctx.save(); setDir();
  const rtl = LANG === 'he';
  font(700, 34);
  const label = `${COPY[LANG].room} · ${COPY[LANG].live}`;
  const w = ctx.measureText(label).width + 96;
  const x = rtl ? W - 60 - w : 60;
  ctx.fillStyle = 'rgba(20,16,12,.55)'; rr(x, 1460, w, 70, 35); ctx.fill();
  const on = Math.floor(t * 1.6) % 2 === 0;
  ctx.fillStyle = on ? '#4CD964' : '#2F8F44';
  ctx.beginPath(); ctx.arc(rtl ? x + w - 40 : x + 40, 1495, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = rtl ? 'right' : 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, rtl ? x + w - 66 : x + 66, 1497);
  // clock
  const hh = Math.floor(clockSec / 3600), mm = Math.floor(clockSec / 60) % 60, ss = Math.floor(clockSec) % 60;
  const clock = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  ctx.direction = 'ltr'; font(500, 34); ctx.textAlign = rtl ? 'left' : 'left';
  const cw = ctx.measureText(clock).width + 48; const cx = rtl ? 60 : x + w + 16;
  ctx.fillStyle = 'rgba(20,16,12,.55)'; rr(cx, 1460, cw, 70, 35); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(clock, cx + 24, 1497);
  ctx.restore();
}

function speechBubble(text, cy, a, sc) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; setDir(); ctx.translate(W / 2, cy); ctx.scale(sc, sc);
  font(800, 96); const tw = ctx.measureText(text).width; const w = tw + 220, h = 170;
  ctx.fillStyle = ACCENT; ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(-w / 2, -h / 2, w, h, 85); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-20, h / 2 - 4); ctx.lineTo(30, h / 2 - 4); ctx.lineTo(-10, h / 2 + 46); ctx.closePath(); ctx.fill();
  ctx.shadowColor = 'transparent';
  // speaker glyph (Talk button in live view)
  const gx = LANG === 'he' ? w / 2 - 100 : -w / 2 + 60;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(gx, -16); ctx.lineTo(gx + 16, -16); ctx.lineTo(gx + 36, -34); ctx.lineTo(gx + 36, 34); ctx.lineTo(gx + 16, 16); ctx.lineTo(gx, 16); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(gx + 40, 0, 18, -.9, .9); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, LANG === 'he' ? -40 : 40, 6);
  ctx.restore();
}

function endCard(a, t) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = '#1C1612'; ctx.fillRect(0, 0, W, H);
  // warm glow
  const g = ctx.createRadialGradient(540, 760, 40, 540, 760, 700);
  g.addColorStop(0, 'rgba(180,84,31,.35)'); g.addColorStop(1, 'rgba(180,84,31,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const k = backOut(prog(t, 12.75, 13.25));
  ctx.save(); ctx.translate(540, 640); ctx.scale(k, k); pawIcon(-90, -90, 180); ctx.restore();
  setDir(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const a1 = easeOut(prog(t, 12.95, 13.4)), a2 = easeOut(prog(t, 13.3, 13.75)), a3 = easeOut(prog(t, 13.65, 14.1));
  font(800, 72); ctx.fillStyle = `rgba(255,248,240,${a1})`;
  const l1 = wrapLines(COPY[LANG].end1, 820); l1.forEach((l, i) => ctx.fillText(l, 540, 860 + i * 88 + (1 - a1) * 30));
  const y2 = 860 + l1.length * 88 + 40;
  font(500, 44); ctx.fillStyle = `rgba(232,214,196,${a2})`;
  ctx.fillText(COPY[LANG].end2, 540, y2 + (1 - a2) * 24);
  ctx.direction = 'ltr'; font(800, 52); ctx.fillStyle = `rgba(255,248,240,${a3})`; ctx.fillText('Dog Monitor', 540, y2 + 150);
  setDir(); font(500, 38); ctx.fillStyle = `rgba(224,123,69,${a3})`; ctx.fillText(COPY[LANG].end3, 540, y2 + 214);
  ctx.restore();
}

// ---------- the timeline (15 s) ----------
function dogState(t) {
  const st = { x: -400, y: 1590, s: 1, facing: 1, legPhase: 0, tail: t * 6, earUp: 0, eyes: 'open', lying: 0, tilt: 0, headTilt: 0, sweat: 0, visible: false };
  if (t < 2.6) return st;
  st.visible = true;
  if (t < 3.3) { // sneaks in, head first
    st.x = lerp(-330, -60, easeOut(prog(t, 2.6, 3.3))); st.legPhase = t * 14; st.tail = t * 4;
  } else if (t < 3.95) { // looks around: is anyone home?
    st.x = -60; st.facing = (t > 3.45 && t < 3.7) ? -1 : 1; if (st.facing < 0) st.x = 220; st.earUp = .6; st.tail = t * 3;
  } else if (t < 4.9) { // trots to the sofa
    st.x = lerp(-60, 470, easeInOut(prog(t, 3.95, 4.9))); st.legPhase = t * 22; st.tail = t * 14;
  } else if (t < 5.5) { // the jump
    const k = easeInOut(prog(t, 4.9, 5.5));
    st.x = lerp(470, 610, k); st.y = lerp(1590, 1150, k) - Math.sin(k * Math.PI) * 230; st.s = lerp(1, .82, k);
    st.tilt = -Math.sin(k * Math.PI) * .35; st.legPhase = 1.2; st.earUp = .9 * Math.sin(k * Math.PI); st.tail = t * 10;
  } else if (t < 6.2) { // happy spin on the cushion
    st.x = 610; st.y = 1150 - Math.abs(Math.sin((t - 5.5) * 9)) * 40; st.s = .82;
    st.facing = Math.floor((t - 5.5) / .17) % 2 === 0 ? 1 : -1; st.tail = t * 20; st.legPhase = t * 20;
  } else if (t < 9.7) { // flop, total bliss
    st.x = 610; st.y = 1150; st.s = .82; st.facing = 1;
    st.lying = easeOut(prog(t, 6.2, 6.55)); st.eyes = t > 6.7 ? 'closed' : 'open'; st.tail = t * (t < 7.5 ? 12 : 5);
    st.headTilt = .12;
  } else if (t < 10.4) { // "Rex." — busted
    st.x = 610; st.y = 1150; st.s = .82; st.lying = 1; st.eyes = 'wide'; st.earUp = 1; st.tail = 0;
    st.headTilt = -.15;
  } else if (t < 11.4) { // slooowly slides off the sofa
    const k = easeIn(prog(t, 10.4, 11.4));
    st.x = lerp(610, 720, k); st.y = lerp(1150, 1590, k); st.s = lerp(.82, 1, k); st.lying = lerp(1, 0, k);
    st.eyes = 'wide'; st.earUp = 1; st.tilt = Math.sin(k * Math.PI) * .25; st.tail = 0;
  } else { // standing there like nothing happened
    st.x = 720; st.y = 1590; st.facing = -1; st.earUp = .4; st.tail = t * 2;
    st.eyes = (t > 11.9 && t < 12.02) ? 'closed' : 'open'; st.sweat = easeOut(prog(t, 11.6, 11.9));
  }
  return st;
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  // door slam shake
  const shake = t > 1.25 && t < 1.55 ? (1.55 - t) * 40 : 0;
  ctx.translate(Math.sin(t * 90) * shake, Math.cos(t * 77) * shake);
  const door = 1 - easeIn(prog(t, .7, 1.25));
  drawRoom(t, door);
  const d = dogState(t);
  const onSofa = d.y < 1300;
  drawSofa();
  if (d.visible) drawDog(d.x, d.y, d.s, d);
  ctx.restore();

  // lens: vignette + grain
  const v = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(grain[Math.floor(t * 30) % 4], 0, 0, W, H);

  // clock: 08:02:10 then the one-minute jump
  let clock = 8 * 3600 + 2 * 60 + 10 + t;
  if (t > 2.2) clock += easeInOut(prog(t, 2.2, 2.7)) * 61;
  camChrome(t, clock);

  const L = COPY[LANG];
  // hook
  const hookA = prog(t, 0, .12) * (1 - prog(t, 2.05, 2.3));
  caption(L.hook, L.hookSub, 470, hookA, lerp(.92, 1, easeOut(prog(t, 0, .3))));
  // one minute later
  caption(L.later, null, 470, prog(t, 2.25, 2.4) * (1 - prog(t, 3.7, 3.9)), 1);
  notification(6.9, 9.5, t);
  // from work: "Rex."
  const ba = prog(t, 9.55, 9.7) * (1 - prog(t, 11.1, 11.3));
  caption(L.fromWork, null, 330, ba, 1);
  speechBubble(L.rex, 560, ba, backOut(prog(t, 9.55, 9.9)));
  // loop line, deadpan
  caption(L.loop, null, 470, prog(t, 11.55, 11.7) * (1 - prog(t, 12.45, 12.6)), 1);
  // end card
  endCard(easeInOut(prog(t, 12.5, 12.85)), t);
}

window.setLang = l => { LANG = l; };
window.draw = draw;
window.frame = (t, q) => { draw(t); return c.toDataURL('image/jpeg', q || .92); };
window.ready = document.fonts.load('800 40px Rubik').then(() => Promise.all([
  document.fonts.load('500 40px Rubik'), document.fonts.load('700 40px Rubik'),
  document.fonts.load('800 40px Rubik', 'אב'), document.fonts.load('500 40px Rubik', 'אב'), document.fonts.load('700 40px Rubik', 'אב')]));
</script></body></html>
