<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Reel 4, "Rex has hated the courier for 3 years." Bell at 11:40, four minutes of full alarm,
// a parcel drops through the mail slot, he lies on it. It was his food.
// The app moment is one real push: "Rex has calmed down" (he: "רקס: חזר השקט"), the calmedDown event.
const W = 1080, H = 1920;
const CX = 460;            // text column center: keeps the right 230 px clear for Instagram's action rail
const c = document.getElementById('c');
const ctx = c.getContext('2d');

const ACCENT = '#B4541F';
const COPY = {
  en: {
    hook: 'Rex has hated\nthe courier\nfor 3 years.',
    hookSub: 'Every day at 11:40.',
    bell: '11:40', bellSub: 'Ding dong.',
    alarm: 'Full alarm.', minute: n => `Minute ${n}`,
    drop: 'Then the parcel drops.',
    won: 'He won.', wonSub: 'Rex 1 · Courier 0',
    notifTitle: 'Rex has calmed down',
    notifSub: 'Hallway',
    food: 'It was Rex’s food.', foodSub: 'See you tomorrow, courier.',
    room: 'Hallway',
    live: 'Live',
    now: 'now',
    end1: 'See what your dog\ndoes when you’re out.',
    end2: 'Your old iPhone becomes the camera.',
    end3: 'Coming soon · link in bio',
  },
  he: {
    hook: 'רקס שונא את השליח\nכבר 3 שנים.',
    hookSub: 'כל יום ב־11:40.',
    bell: '11:40', bellSub: 'דינג דונג.',
    alarm: 'כוננות מלאה.', minute: n => `דקה ${n}`,
    drop: 'ואז נופלת חבילה.',
    won: 'הוא ניצח.', wonSub: 'רקס 1 · השליח 0',
    notifTitle: 'רקס: חזר השקט',
    notifSub: 'מסדרון',
    food: 'זה היה האוכל שלו.', foodSub: 'נתראה מחר, שליח.',
    room: 'מסדרון',
    live: 'בשידור',
    now: 'עכשיו',
    end1: 'תראו מה הכלב עושה\nכשאתם לא בבית.',
    end2: 'האייפון הישן הופך למצלמה.',
    end3: 'בקרוב · הקישור בביו',
  },
};
let LANG = 'en';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const backOut = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

const grain = [];
let seed = 41;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let k = 0; k < 4; k++) {
  const g = document.createElement('canvas'); g.width = 270; g.height = 480;
  const gx = g.getContext('2d'); const id = gx.createImageData(270, 480);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 16; }
  gx.putImageData(id, 0, 0); grain.push(g);
}

// ---------- the timeline (15 s) ----------
const BELL = 2.2;      // ding dong
const RUN = 2.95;      // up and to the door
const ALARM = 3.6;     // four minutes of barking, sped up
const DROP = 6.9;      // the mail slot flaps, the parcel falls
const DOWN = 8.25;     // he lies down on it
const NOTIF = 9.5;     // "Rex has calmed down"
const FOOD = 11.75;    // the reveal
const END = 12.7;      // end card
function clockAt(t) {
  const start = 11 * 3600 + 39 * 60 + 52;
  if (t < ALARM) return start + t * 3.6;
  if (t < DROP) return lerp(start + ALARM * 3.6, 11 * 3600 + 44 * 60 + 2, prog(t, ALARM, DROP));
  return 11 * 3600 + 44 * 60 + 2 + (t - DROP);
}
function minuteAt(t) { return 1 + Math.min(3, Math.floor(prog(t, ALARM, DROP - .25) * 4)); }
function barkAt(t, t0, period = .3) { // a bark every `period` seconds from t0
  if (t < t0) return 0;
  const k = ((t - t0) % period) / period;
  return k < .55 ? Math.sin(k / .55 * Math.PI) : 0;
}

// ---------- room: a dusty-rose hallway, checker floor, green front door with a brass mail slot ----------
const DOOR = { x: 600, y: 520, w: 300, h: 720 };
const SLOT = { x: DOOR.x + 90, y: 960, w: 120, h: 26 };
function drawRoom(t, flap) {
  const wall = ctx.createLinearGradient(0, 0, 0, 1240);
  wall.addColorStop(0, '#C99C8C'); wall.addColorStop(1, '#DDB9A9');
  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, 1240);
  // wainscot
  ctx.fillStyle = '#E9D7CB'; ctx.fillRect(0, 960, W, 280);
  ctx.fillStyle = '#F3E8DF'; ctx.fillRect(0, 950, W, 14);
  ctx.strokeStyle = 'rgba(120,80,60,.12)'; ctx.lineWidth = 4;
  for (let x = 30; x < W; x += 150) { rr(x, 990, 120, 220, 6); ctx.stroke(); }
  // coat hooks (left): yellow raincoat and Rex's lead
  ctx.fillStyle = '#6B4E3A'; rr(60, 600, 400, 30, 8); ctx.fill();
  ctx.fillStyle = '#C9A24A'; for (const x of [110, 230, 350]) { ctx.beginPath(); ctx.arc(x, 640, 10, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#E5B53B';
  ctx.beginPath(); ctx.moveTo(110, 640); ctx.lineTo(40, 700); ctx.lineTo(30, 960); ctx.lineTo(190, 960); ctx.lineTo(180, 700); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#CF9E2A'; ctx.beginPath(); ctx.moveTo(110, 640); ctx.lineTo(90, 700); ctx.lineTo(130, 700); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2E6E73'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(230, 640); ctx.quadraticCurveTo(200, 760, 238, 860); ctx.quadraticCurveTo(262, 760, 230, 640); ctx.stroke();
  ctx.fillStyle = '#9AA0A6'; ctx.beginPath(); ctx.arc(238, 868, 12, 0, Math.PI * 2); ctx.fill();
  // a round mirror above a little shelf
  ctx.fillStyle = '#C9A24A'; ctx.beginPath(); ctx.arc(330, 420, 92, 0, Math.PI * 2); ctx.fill();
  const m = ctx.createLinearGradient(260, 340, 400, 500); m.addColorStop(0, '#E8EEF0'); m.addColorStop(1, '#B9C6CC');
  ctx.fillStyle = m; ctx.beginPath(); ctx.arc(330, 420, 80, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(290, 400); ctx.lineTo(320, 370); ctx.stroke();
  // shoe rack
  ctx.fillStyle = '#7A5A44'; ctx.fillRect(250, 1120, 300, 18); ctx.fillRect(250, 1200, 300, 18);
  ctx.fillRect(250, 1120, 14, 120); ctx.fillRect(536, 1120, 14, 120);
  ctx.fillStyle = '#3C5A8A'; rr(275, 1080, 110, 42, 18); ctx.fill();
  ctx.fillStyle = '#F2F2F2'; rr(405, 1160, 110, 42, 18); ctx.fill();
  ctx.fillStyle = '#B23A2E'; rr(290, 1160, 96, 42, 18); ctx.fill();
  // front door
  ctx.fillStyle = '#F3E8DF'; ctx.fillRect(DOOR.x - 24, DOOR.y - 24, DOOR.w + 48, DOOR.h + 24);
  ctx.fillStyle = '#2F5D4E'; ctx.fillRect(DOOR.x, DOOR.y, DOOR.w, DOOR.h);
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 6;
  rr(DOOR.x + 40, DOOR.y + 50, DOOR.w - 80, 300, 8); ctx.stroke();
  rr(DOOR.x + 40, DOOR.y + 500, DOOR.w - 80, 180, 8); ctx.stroke();
  ctx.fillStyle = '#FFE7B8'; ctx.globalAlpha = .7; rr(DOOR.x + 110, DOOR.y + 80, 80, 80, 40); ctx.fill(); ctx.globalAlpha = 1; // peephole glass
  ctx.fillStyle = '#C9A24A'; ctx.beginPath(); ctx.arc(DOOR.x + DOOR.w - 44, 930, 14, 0, Math.PI * 2); ctx.fill();
  // mail slot: brass plate, the flap swings in when the parcel comes
  ctx.fillStyle = '#C9A24A'; rr(SLOT.x - 16, SLOT.y - 16, SLOT.w + 32, SLOT.h + 32, 10); ctx.fill();
  ctx.fillStyle = '#1C1612'; ctx.fillRect(SLOT.x, SLOT.y, SLOT.w, SLOT.h);
  ctx.fillStyle = '#B08A36'; ctx.fillRect(SLOT.x, SLOT.y + flap * 30, SLOT.w, Math.max(4, SLOT.h * (1 - flap)));
  // floor: checker tiles in perspective
  ctx.fillStyle = '#EDE6DA'; ctx.fillRect(0, 1240, W, H - 1240);
  const rows = [1240, 1290, 1350, 1425, 1515, 1625, 1760, 1920];
  for (let r = 0; r < rows.length - 1; r++) {
    const y0 = rows[r], y1 = rows[r + 1];
    for (let i = -10; i < 12; i++) {
      if ((i + r) % 2 === 0) continue;
      const x = (y, j) => 540 + (j - 0.5) * lerp(90, 260, (y - 1240) / 680);
      ctx.fillStyle = '#9C958C';
      ctx.beginPath(); ctx.moveTo(x(y0, i), y0); ctx.lineTo(x(y0, i + 1), y0); ctx.lineTo(x(y1, i + 1), y1); ctx.lineTo(x(y1, i), y1); ctx.closePath(); ctx.fill();
    }
  }
  ctx.fillStyle = '#F3E8DF'; ctx.fillRect(0, 1226, DOOR.x - 24, 18); ctx.fillRect(DOOR.x + DOOR.w + 24, 1226, W, 18);
  // doormat
  ctx.fillStyle = '#B98A55'; ctx.beginPath(); ctx.moveTo(DOOR.x - 10, 1256); ctx.lineTo(DOOR.x + DOOR.w + 10, 1256); ctx.lineTo(DOOR.x + DOOR.w + 50, 1340); ctx.lineTo(DOOR.x - 50, 1340); ctx.closePath(); ctx.fill();
  // Rex's bed (left, foreground)
  ctx.fillStyle = '#4F6D8F'; ctx.beginPath(); ctx.ellipse(340, 1730, 300, 110, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6F8DAF'; ctx.beginPath(); ctx.ellipse(340, 1716, 240, 76, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------- the parcel ----------
function parcelPos(t) {
  // through the slot, falls to the mat, skids towards the camera
  const f = prog(t, DROP + .2, DROP + .55), s = easeOut(prog(t, DROP + .55, DROP + 1.0));
  if (t < DROP + .55) return { x: SLOT.x + SLOT.w / 2, y: lerp(SLOT.y + 30, 1300, easeIn(f)), s: .6, rot: f * .6, vis: t > DROP + .2 };
  return { x: lerp(SLOT.x + SLOT.w / 2, 540, s), y: lerp(1300, 1730, s) + Math.sin(s * Math.PI) * -30, s: lerp(.6, 1, s), rot: lerp(.6, -.08, s), vis: true };
}
function drawParcel(t) {
  const p = parcelPos(t); if (!p.vis) return;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.s, p.s); ctx.rotate(p.rot);
  ctx.fillStyle = 'rgba(30,20,10,.22)'; ctx.beginPath(); ctx.ellipse(0, 50, 130, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#C49A68'; rr(-120, -60, 240, 110, 10); ctx.fill();          // kraft box
  ctx.fillStyle = '#B08656'; ctx.fillRect(-120, -60, 240, 18);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-14, -60, 28, 110);     // tape
  ctx.fillStyle = '#FFFFFF'; rr(-106, -26, 76, 56, 6); ctx.fill();              // label with a bone
  ctx.fillStyle = ACCENT;
  ctx.beginPath(); ctx.arc(-90, -10, 8, 0, Math.PI * 2); ctx.arc(-90, 6, 8, 0, Math.PI * 2); ctx.arc(-46, -10, 8, 0, Math.PI * 2); ctx.arc(-46, 6, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-90, -6, 44, 8);
  ctx.restore();
}

// ---------- dog (slate grey, white chest and socks, teal collar) ----------
const COLLAR = '#2E8C8A';
function drawDog(x, y, s, p) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * p.facing, s);
  const lying = p.lying || 0;
  const hop = p.hop || 0;
  const legLen = lerp(82, 12, lying);
  const bodyY = -legLen - 58 - hop;
  ctx.save(); ctx.fillStyle = 'rgba(30,20,10,.22)'; ctx.beginPath(); ctx.ellipse(0, 4, 170 - hop * .5, 22, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.rotate(p.tilt || 0);
  const COAT = '#7E8288', FAR = '#666A70', SOCK = '#F4F1EC', CHEST = '#F4F1EC', DARK = '#1E1C1B', EAR = '#55595F';
  const tw = p.tail || 0;
  ctx.strokeStyle = COAT; ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-130, bodyY - 20);
  ctx.quadraticCurveTo(-200, bodyY - 40 + lying * 40, -205 + Math.sin(tw) * 40, bodyY - 90 + lying * 70); ctx.stroke();
  const leg = (lx, ph, far) => {
    const swing = Math.sin(ph) * 22 * (1 - lying);
    ctx.strokeStyle = far ? FAR : COAT; ctx.lineWidth = 30;
    ctx.beginPath(); ctx.moveTo(lx, bodyY + 20); ctx.lineTo(lx + swing, -8 - hop); ctx.stroke();
    ctx.fillStyle = SOCK; ctx.beginPath(); ctx.ellipse(lx + swing + 8, -6 - hop, 22, 11, 0, 0, Math.PI * 2); ctx.fill();
  };
  const lp = p.legPhase || 0;
  leg(-95, lp + Math.PI, true); leg(80, lp, true);
  ctx.fillStyle = COAT; rr(-150, bodyY - 62, 290, 124, 62); ctx.fill();
  ctx.fillStyle = FAR; ctx.beginPath(); ctx.ellipse(-40, bodyY - 30, 60, 26, 0, 0, Math.PI * 2); ctx.fill(); // darker saddle
  ctx.fillStyle = CHEST; ctx.beginPath(); ctx.ellipse(98, bodyY + 18, 46, 38, -.3, 0, Math.PI * 2); ctx.fill();
  leg(-115, lp, false); leg(100, lp + Math.PI, false);
  const hx = 150, hy = bodyY - 70 + lying * 34;
  ctx.strokeStyle = COLLAR; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(108, bodyY - 70 + lying * 20); ctx.lineTo(128, bodyY + 4); ctx.stroke();
  ctx.fillStyle = '#E8B84A'; ctx.beginPath(); ctx.arc(126, bodyY + 18, 11, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(p.headTilt || 0);
  const bark = p.bark || 0;
  ctx.fillStyle = COAT; ctx.beginPath(); ctx.arc(0, 0, 68, 0, Math.PI * 2); ctx.fill();
  if (bark > 0) {
    ctx.fillStyle = '#4A1E18'; ctx.beginPath(); ctx.ellipse(86, 54, 34, 8 + 22 * bark, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#E07A7A'; ctx.beginPath(); ctx.ellipse(82, 60 + 12 * bark, 16, 7 * bark + 2, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = CHEST; rr(30, 0, 92, 54 - bark * 6, 27); ctx.fill();         // white muzzle
  ctx.beginPath(); ctx.moveTo(-6, -64); ctx.quadraticCurveTo(14, -20, 40, 4); ctx.lineTo(30, 10); ctx.quadraticCurveTo(4, -20, -14, -62); ctx.fill(); // white blaze
  ctx.fillStyle = DARK; ctx.beginPath(); ctx.ellipse(116, 12, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
  if (!bark) { ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(70, 44); ctx.quadraticCurveTo(88, 54, 106, 42); ctx.stroke(); }
  if (p.eyes === 'closed') {
    ctx.strokeStyle = '#3A3634'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(14, -14, 12, .2, Math.PI - .2); ctx.stroke();
  } else {
    const r = p.eyes === 'wide' ? 15 : 11;
    ctx.fillStyle = '#EDE3D3'; ctx.beginPath(); ctx.arc(14, -15, r + 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(17, -15, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(21, -20, r * .35, 0, Math.PI * 2); ctx.fill();
    if (p.brow) { ctx.strokeStyle = DARK; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-6, -44); ctx.lineTo(34, -34); ctx.stroke(); } // the angry eyebrow
  }
  const eu = p.earUp || 0;
  ctx.fillStyle = EAR; ctx.save(); ctx.translate(-28, -46);
  ctx.rotate(lerp(.55, -.5, eu));
  ctx.beginPath(); ctx.ellipse(0, lerp(40, -30, eu), 26, 52, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  if (bark > .25) {
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8;
    const d = 18 * bark;
    [[-.55, 30], [0, 34], [.55, 30]].forEach(([a, len]) => {
      const sx = 150 + Math.cos(a) * 14, sy = 30 + Math.sin(a) * 40;
      ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * d, sy + Math.sin(a) * d); ctx.lineTo(sx + Math.cos(a) * (d + len), sy + Math.sin(a) * (d + len)); ctx.stroke();
    });
    ctx.shadowColor = 'transparent';
  }
  ctx.restore();
  ctx.restore();
}

function zzz(x, y, t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.direction = 'ltr'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) {
    const k = ((t * .7 + i / 3) % 1);
    ctx.globalAlpha = a * Math.sin(k * Math.PI);
    font(800, 40 + i * 12); ctx.fillStyle = '#FFFFFF';
    ctx.fillText('z', x + k * 60 + i * 10, y - k * 90);
  }
  ctx.restore();
}

function dogState(t) {
  const st = { x: 330, y: 1740, s: .78, facing: 1, legPhase: 0, tail: 0, earUp: 0, eyes: 'closed', lying: 1, tilt: 0, headTilt: .12, bark: 0, hop: 0, brow: false };
  if (t < BELL) { st.headTilt = .12 + Math.sin(t * 3) * .03; return st; } // asleep in his bed
  if (t < RUN) { // the bell: eyes, ears, up
    st.eyes = 'wide'; st.earUp = easeOut(prog(t, BELL, BELL + .2)); st.headTilt = -.15;
    st.lying = 1 - easeOut(prog(t, BELL + .4, RUN)); st.brow = t > BELL + .35;
    return st;
  }
  if (t < ALARM) { // to the door
    const k = easeInOut(prog(t, RUN, ALARM));
    Object.assign(st, { lying: 0, eyes: 'wide', earUp: 1, brow: true, headTilt: -.1, legPhase: t * 26, tail: t * 10 });
    st.x = lerp(330, 640, k); st.y = lerp(1740, 1620, k); st.s = lerp(.78, .8, k);
    return st;
  }
  Object.assign(st, { x: 640, y: 1620, s: .8, lying: 0, eyes: 'open', earUp: 1, brow: true, tail: t * 12 });
  if (t < DROP + .1) { // full alarm, four minutes in three seconds
    const k = t - ALARM;
    st.bark = barkAt(t, ALARM, .26);
    st.headTilt = -.35 - st.bark * .15;
    if ((k > .9 && k < 1.5) || (k > 2.2 && k < 2.8)) st.hop = Math.abs(Math.sin((k - .9) * 10)) * 50; // up on the back legs
    st.tilt = -st.hop / 400;
    return st;
  }
  const p = parcelPos(t);
  if (t < DOWN) { // silence. turns, looks, sniffs
    st.brow = false; st.eyes = t < DROP + .6 ? 'wide' : 'open';
    st.facing = t > DROP + .7 ? -1 : 1; st.headTilt = t > DROP + .7 ? .25 + Math.sin(t * 14) * .04 : -.2;
    st.tail = t > DROP + .9 ? t * 20 : 0;
    st.x = lerp(640, 760, easeInOut(prog(t, DROP + .8, DOWN))); st.y = lerp(1620, 1720, easeInOut(prog(t, DROP + .8, DOWN)));
    st.s = lerp(.8, .82, easeInOut(prog(t, DROP + .8, DOWN))); st.legPhase = t * 18 * (t > DROP + .8 ? 1 : 0);
    return st;
  }
  // lies down with the parcel under his chin
  Object.assign(st, { facing: -1, x: 760, y: 1720, s: .82, brow: false, earUp: .3, tail: t * 5 });
  st.lying = easeOut(prog(t, DOWN, DOWN + .4));
  st.eyes = t > NOTIF + .3 ? 'closed' : 'open';
  st.headTilt = .18;
  return st;
}

// ---------- overlays ----------
function font(w, px) { ctx.font = `${w} ${px}px Rubik`; }
function setDir() { ctx.direction = LANG === 'he' ? 'rtl' : 'ltr'; }

function wrapLines(text, maxW) {
  if (text.includes('\n')) return text.split('\n');
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

function caption(text, sub, cy, a, scale = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; setDir();
  ctx.translate(CX, cy); ctx.scale(scale, scale);
  font(800, 62); const lines = wrapLines(text, 600);
  font(500, 38); const subW = sub ? ctx.measureText(sub).width : 0;
  font(800, 62);
  const lw = Math.max(subW, ...lines.map(l => ctx.measureText(l).width));
  const h = lines.length * 76 + (sub ? 58 : 0) + 56;
  ctx.fillStyle = '#FFFFFF'; ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  rr(-lw / 2 - 44, -h / 2, lw + 88, h, 34); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#16120F'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let y = -h / 2 + 28 + 38;
  for (const l of lines) { ctx.fillText(l, 0, y); y += 76; }
  if (sub) { font(500, 38); ctx.fillStyle = '#6E655C'; ctx.fillText(sub, 0, y - 8); }
  ctx.restore();
}

function pawIcon(x, y, size, bg = ACCENT, fg = '#FFF') {
  ctx.fillStyle = bg; rr(x, y, size, size, size * .23); ctx.fill();
  ctx.fillStyle = fg; const cx = x + size / 2, cy = y + size / 2, u = size / 100;
  ctx.beginPath(); ctx.ellipse(cx, cy + 14 * u, 22 * u, 18 * u, 0, 0, Math.PI * 2); ctx.fill();
  [[-27, -10], [-10, -27], [10, -27], [27, -10]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.ellipse(cx + dx * u, cy + dy * u, 9 * u, 11 * u, dx * .02, 0, Math.PI * 2); ctx.fill(); });
}

// the push, as iOS shows it; kept left of the action rail (x 50..850)
function notification(t0, t1, t) {
  const inP = easeOut(prog(t, t0, t0 + .45)), outP = easeIn(prog(t, t1 - .35, t1));
  if (inP <= 0 || outP >= 1) return;
  const x0 = 50, w = 800, y = lerp(-260, 300, inP) - outP * 560;
  ctx.save(); setDir();
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 14;
  ctx.fillStyle = 'rgba(250,247,243,.97)'; rr(x0, y, w, 200, 52); ctx.fill(); ctx.shadowColor = 'transparent';
  const rtl = LANG === 'he';
  const iconX = rtl ? x0 + w - 34 - 104 : x0 + 34;
  pawIcon(iconX, y + 48, 104);
  ctx.textBaseline = 'alphabetic';
  const tx = rtl ? iconX - 30 : iconX + 104 + 30;
  ctx.textAlign = rtl ? 'right' : 'left';
  font(500, 32); ctx.fillStyle = '#7A726A'; ctx.fillText('Dog Monitor', tx, y + 74);
  ctx.textAlign = rtl ? 'left' : 'right'; ctx.fillText(COPY[LANG].now, rtl ? x0 + 34 : x0 + w - 34, y + 74);
  ctx.textAlign = rtl ? 'right' : 'left';
  font(700, 46); ctx.fillStyle = '#16120F'; ctx.fillText(COPY[LANG].notifTitle, tx, y + 128);
  font(500, 36); ctx.fillStyle = '#5C544C'; ctx.fillText(COPY[LANG].notifSub, tx, y + 172);
  ctx.restore();
}

function camChrome(t, clockSec) {
  ctx.save(); setDir();
  const rtl = LANG === 'he';
  font(700, 34);
  const label = `${COPY[LANG].room} · ${COPY[LANG].live}`;
  const w = ctx.measureText(label).width + 96;
  const x = rtl ? 850 - w : 60;
  ctx.fillStyle = 'rgba(20,16,12,.55)'; rr(x, 1350, w, 70, 35); ctx.fill();
  const on = Math.floor(t * 1.6) % 2 === 0;
  ctx.fillStyle = on ? '#4CD964' : '#2F8F44';
  ctx.beginPath(); ctx.arc(rtl ? x + w - 40 : x + 40, 1385, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = rtl ? 'right' : 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, rtl ? x + w - 66 : x + 66, 1387);
  const hh = Math.floor(clockSec / 3600), mm = Math.floor(clockSec / 60) % 60, ss = Math.floor(clockSec) % 60;
  const clock = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  ctx.direction = 'ltr'; font(500, 34); ctx.textAlign = 'left';
  const cw = ctx.measureText(clock).width + 48; const cx = rtl ? x - 16 - cw : x + w + 16;
  ctx.fillStyle = 'rgba(20,16,12,.55)'; rr(cx, 1350, cw, 70, 35); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(clock, cx + 24, 1387);
  ctx.restore();
}

function endCard(a, t) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = '#1C1612'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(CX, 760, 40, CX, 760, 700);
  g.addColorStop(0, 'rgba(180,84,31,.35)'); g.addColorStop(1, 'rgba(180,84,31,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const k = backOut(prog(t, 12.75, 13.25));
  ctx.save(); ctx.translate(CX, 640); ctx.scale(k, k); pawIcon(-90, -90, 180); ctx.restore();
  setDir(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const a1 = easeOut(prog(t, 12.95, 13.4)), a2 = easeOut(prog(t, 13.3, 13.75)), a3 = easeOut(prog(t, 13.65, 14.1));
  font(800, 72); ctx.fillStyle = `rgba(255,248,240,${a1})`;
  const l1 = wrapLines(COPY[LANG].end1, 720); l1.forEach((l, i) => ctx.fillText(l, CX, 860 + i * 88 + (1 - a1) * 30));
  const y2 = 860 + l1.length * 88 + 40;
  font(500, 40); ctx.fillStyle = `rgba(232,214,196,${a2})`;
  wrapLines(COPY[LANG].end2, 800).forEach((l, i) => ctx.fillText(l, CX, y2 + i * 56 + (1 - a2) * 24));
  const y3 = y2 + wrapLines(COPY[LANG].end2, 800).length * 56;
  ctx.direction = 'ltr'; font(800, 52); ctx.fillStyle = `rgba(255,248,240,${a3})`; ctx.fillText('Dog Monitor', CX, y3 + 100);
  setDir(); font(500, 38); ctx.fillStyle = `rgba(224,123,69,${a3})`; ctx.fillText(COPY[LANG].end3, CX, y3 + 164);
  ctx.restore();
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const d = dogState(t);
  ctx.save();
  const shake = d.bark * 6 + (t > BELL && t < BELL + .25 ? 6 : 0);
  ctx.translate(Math.sin(t * 90) * shake, Math.cos(t * 77) * shake);
  const flap = Math.sin(prog(t, DROP, DROP + .5) * Math.PI);
  drawRoom(t, flap);
  const p = parcelPos(t);
  const parcelInFront = t < DOWN && p.y > d.y + 10; // skidding past him; once he lies down his chin goes on top
  if (!parcelInFront) drawParcel(t);
  drawDog(d.x, d.y, d.s, d);
  if (parcelInFront) drawParcel(t);
  ctx.restore();
  zzz(d.x + 170, d.y - 90, t, 1 - prog(t, BELL - .1, BELL));

  const v = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(grain[Math.floor(t * 30) % 4], 0, 0, W, H);
  camChrome(t, clockAt(t));

  const L = COPY[LANG];
  const pop = t0 => lerp(.9, 1, backOut(prog(t, t0, t0 + .2)));
  const span = (a, b) => prog(t, a, a + .12) * (1 - prog(t, b - .12, b));
  caption(L.hook, L.hookSub, 400, span(-1, BELL + .15), lerp(.92, 1, easeOut(prog(t, 0, .3))));
  caption(L.bell, L.bellSub, 360, span(BELL + .15, ALARM), pop(BELL + .15));
  caption(L.alarm, L.minute(minuteAt(t)), 360, span(ALARM, DROP), pop(ALARM));
  caption(L.drop, null, 360, span(DROP, DOWN), pop(DROP));
  caption(L.won, L.wonSub, 360, span(DOWN, NOTIF + .1), pop(DOWN));
  notification(NOTIF, FOOD, t);
  caption(L.food, L.foodSub, 380, span(FOOD, END + .1), pop(FOOD));
  endCard(easeInOut(prog(t, END, END + .35)), t);
}

window.setLang = l => { LANG = l; };
window.draw = draw;
window.frame = (t, q) => { draw(t); return c.toDataURL('image/jpeg', q || .92); };
window.ready = document.fonts.load('800 40px Rubik').then(() => Promise.all([
  document.fonts.load('500 40px Rubik'), document.fonts.load('700 40px Rubik'),
  document.fonts.load('800 40px Rubik', 'אב'), document.fonts.load('500 40px Rubik', 'אב'), document.fonts.load('700 40px Rubik', 'אב')]));
</script></body></html>
