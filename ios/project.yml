name: DogMonitor

options:
  bundleIdPrefix: com.benooon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  DogMonitorCore:
    path: Packages/DogMonitorCore
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    majorVersion: 2.0.0

targets:
  DogMonitor:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: DogMonitorCore
      - package: LiveKit
      - target: NotificationService
      - target: DogMonitorWidgets
    info:
      path: Config/DogMonitor-Info.plist
      properties:
        CFBundleDisplayName: Dog Monitor
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - he
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # A camera's dog state on the Lock Screen and in the Dynamic Island (DogMonitorWidgets).
        NSSupportsLiveActivities: true
        DMAPIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: every orientation, so the viewer works in Split View and Stage Manager.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Dog Monitor uses the camera to watch your dog, share live video with your family and take your dog's photo.
        NSMicrophoneUsageDescription: Dog Monitor uses the microphone to detect barking and to let you hear and talk to your dog.
        NSLocalNetworkUsageDescription: Dog Monitor uses the local network to find and pair with your other devices.
    entitlements:
      path: Config/DogMonitor.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # Invite links open the app (the backend serves the apple-app-site-association file).
        com.apple.developer.associated-domains:
          - applinks:$(APP_LINK_HOST)
        # Shared with DogMonitorWidgets for the dog status widget.
        com.apple.security.application-groups:
          - group.com.benooon.dogmonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benooon.dogmonitor
        # Backend on Railway (backend/, deployed from main).
        API_BASE_URL: https://dog-monitor-production.up.railway.app
        # Host of API_BASE_URL, for invite Universal Links. Change together with API_BASE_URL.
        APP_LINK_HOST: dog-monitor-production.up.railway.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        # App/Assets.xcassets: warm paw icon (light + dark) and the app's single accent color.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: DogMonitorCore
    info:
      path: Config/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Dog Monitor Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benooon.dogmonitor.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"

  DogMonitorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/Localizable.xcstrings
    dependencies:
      - package: DogMonitorCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Config/DogMonitorWidgets-Info.plist
      properties:
        CFBundleDisplayName: Dog Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/DogMonitorWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.benooon.dogmonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benooon.dogmonitor.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  DogMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # Loaded with SKTestSession so the Premium screenshot shows the real store.
      - path: StoreKit/DogMonitor.storekit
        buildPhase: resources
    dependencies:
      - target: DogMonitor
      - package: DogMonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benooon.dogmonitor.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DogMonitor:
    build:
      targets:
        DogMonitor: all
        DogMonitorTests: [test]
    run:
      config: Debug
      # Local purchases for the simulator. The backend can't verify these (Xcode signs them), so
      # Premium shows up only with sandbox or TestFlight purchases.
      storeKitConfiguration: StoreKit/DogMonitor.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DogMonitorTests
        - package: DogMonitorCore/DogMonitorCoreTests
