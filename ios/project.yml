name: DogMonitor

options:
  bundleIdPrefix: com.benooon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  DogMonitorCore:
    path: Packages/DogMonitorCore
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    majorVersion: 2.0.0

targets:
  DogMonitor:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DogMonitorCore
      - package: LiveKit
      - target: NotificationService
    info:
      path: Config/DogMonitor-Info.plist
      properties:
        CFBundleDisplayName: Dog Monitor
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - he
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        DMAPIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Dog Monitor uses the camera to watch your dog and stream live video to your family.
        NSMicrophoneUsageDescription: Dog Monitor uses the microphone to detect barking and to let you hear and talk to your dog.
        NSLocalNetworkUsageDescription: Dog Monitor uses the local network to find and pair with your other devices.
    entitlements:
      path: Config/DogMonitor.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # Invite links open the app (the backend serves the apple-app-site-association file).
        com.apple.developer.associated-domains:
          - applinks:$(APP_LINK_HOST)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benooon.dogmonitor
        # Backend URL; set to the Railway domain once it exists (see docs/HUMAN_TODO.md).
        API_BASE_URL: http://localhost:3000
        # Host of API_BASE_URL, for invite Universal Links. Set together with API_BASE_URL.
        APP_LINK_HOST: localhost
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: DogMonitorCore
    info:
      path: Config/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Dog Monitor Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benooon.dogmonitor.NotificationService
        TARGETED_DEVICE_FAMILY: "1"

  DogMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DogMonitor
      - package: DogMonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benooon.dogmonitor.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DogMonitor:
    build:
      targets:
        DogMonitor: all
        DogMonitorTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DogMonitorTests
        - package: DogMonitorCore/DogMonitorCoreTests
